[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbot"
version = "0.1.0"
description = "Deterministic signal-checking core for Udit's Telegram-to-Dhan bot"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Udit" }]
dependencies = []

[project.scripts]
codexbot-db = "codexbot.db_maintenance:main"
codexbot-instruments = "codexbot.instrument_maintenance:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
